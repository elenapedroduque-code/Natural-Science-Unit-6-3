<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minerals</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        img {
            width: 100%;
            border-radius: 8px;
        }

        .label {
            margin-top: 10px;
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        .back {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 24px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.2s;
        }

        .back:hover {
            background: #357ABD;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>Minerals</h1>

    <div class="grid">

        <div class="card">
            <img src="inorganic.jpg" alt="Inorganic mineral">
            <div class="label">Inorganic</div>
        </div>

        <div class="card">
            <img src="mineral1.jpg" alt="Mineral 1">
            <div class="label">Mineral 1</div>
        </div>

        <div class="card">
            <img src="mineral2.jpg" alt="Mineral 2">
            <div class="label">Mineral 2</div>
        </div>

        <div class="card">
            <img src="mineral3.jpg" alt="Mineral 3">
            <div class="label">Mineral 3</div>
        </div>

    </div>

    <!-- BOTÓN CORRECTO DESDE LA CARPETA MINERALS -->
    <a class="back" href="../index.html">← Back to menu</a>

</body>
</html>
